    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- GSAP 动画库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1a365d', // 深蓝色
                        secondary: '#ecc94b', // 金色
                        dark: '#0f172a',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            }
            .text-shadow-lg {
                text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            }
            .glass {
                background: rgba(255, 255, 255, 0.25);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.18);
            }
            .glass-dark {
                background: rgba(15, 23, 42, 0.75);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            .vinyl-record {
                background: radial-gradient(circle, #000000 0%, #1a1a1a 80%, #000000 100%);
                position: relative;
                overflow: hidden;
            }
            .vinyl-record::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 20%;
                height: 20%;
                background: radial-gradient(circle, #ffffff 0%, #e0e0e0 70%, #ffffff 100%);
                border-radius: 50%;
            }
            .vinyl-record::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: repeating-radial-gradient(
                    circle at center,
                    rgba(255, 255, 255, 0.1) 0px,
                    rgba(255, 255, 255, 0.1) 1px,
                    transparent 1px,
                    transparent 4px
                );
                border-radius: 50%;
            }
            .rotate-record {
                animation: rotate 10s linear infinite;
            }
            @keyframes rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            .music-note {
                animation: float 3s ease-in-out infinite;
            }
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-10px); }
            }
            .button-3d {
                transform-style: preserve-3d;
                transform: perspective(1000px);
                transition: all 0.3s ease;
            }
            .button-3d::before {
                content: '';
                position: absolute;
                width: 100%;
                height: 100%;
                left: 0;
                bottom: -4px;
                background: rgba(0, 0, 0, 0.2);
                transform: translateZ(-1px);
                border-radius: inherit;
            }
            .button-3d:active {
                transform: perspective(1000px) translateZ(-2px);
            }
            .button-3d:active::before {
                bottom: -2px;
            }
        }
    </style>
</head>

    <script>
        // 全局调试模式
        const DEBUG_MODE = true;
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 显示调试信息
            if (DEBUG_MODE) {
                console.log('=== 足球之音音乐盒 - 调试模式 ===');
                console.log('页面加载完成，开始初始化...');
            }
            // 获取DOM元素
            const btnPlay = document.getElementById('btn-play');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnConvo1 = document.getElementById('btn-convo1');
            const btnConvo2 = document.getElementById('btn-convo2');
            const vinylRecord = document.getElementById('vinyl-record');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const totalTimeEl = document.getElementById('total-time');
            const chatContainer = document.getElementById('chat-container');
            const currentTrackEl = document.getElementById('current-track'); // 新增：当前曲目显示
            
            // 状态变量
            let isPlaying = false;
            let progressInterval;
            let currentProgress = 0;
            
            // 扩展播放列表（6首音乐）- 修复了中文逗号问题，替换为英文逗号
            const playlist = [
                {
                    title: "2026+年世界杯竞猜玩法介绍",
                    artist: "山人体彩",
                    url: "https://dgtg149.github.io/dgtgvtkje/2026+年世界杯竞猜玩法介绍.mp3"
                }, 
                {
                    title: "匈牙利友谊赛主场迎战哈萨克斯坦",
                    artist: "山人体彩",
                    url: "https://dgtg149.github.io/dgtgvtkje/匈牙利友谊赛主场迎战哈萨克斯坦.mp3"
                },
                {
                    title: "测试音频 - 钢琴",
                    artist: "免费音效",
                    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
                },
                {
                    title: "活力跑步运动",
                    artist: "运动音频",
                    url: "https://dgtg149.github.io/dgtgvtkje/活力跑步运动.mp3"
                },
                {
                    title: "中国国家队友谊赛对阵泰国",
                    artist: "山人体彩",
                    url: "https://dgtg149.github.io/dgtgvtkje/中国国家队友谊赛对阵泰国.mp3"
                },
                {
                    title: "测试音频 - 摇滚",
                    artist: "免费音效",
                    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
                }
            ];
            
            let currentTrackIndex = 0;
            let audioPlayer = document.getElementById('audio-player');
            
            // 预加载测试
            function preloadTest() {
                if (DEBUG_MODE) console.log('开始预加载测试...');
                
                // 测试音频API支持
                testAudioSupport();
                
                // 测试网络连接
                testNetworkConnection();
                
                // 测试CORS支持
                testCorsSupport();
            }
            
            // 测试音频API支持
            function testAudioSupport() {
                const audioTest = document.createElement('audio');
                const canPlayMP3 = !!(audioTest.canPlayType && audioTest.canPlayType('audio/mpeg;').replace(/no/, ''));
                const canPlayWAV = !!(audioTest.canPlayType && audioTest.canPlayType('audio/wav;').replace(/no/, ''));
                const canPlayOGG = !!(audioTest.canPlayType && audioTest.canPlayType('audio/ogg; codecs="vorbis"').replace(/no/, ''));
                
                if (DEBUG_MODE) {
                    console.log('音频格式支持检测:');
                    console.log('- MP3:', canPlayMP3 ? '✓ 支持' : '✗ 不支持');
                    console.log('- WAV:', canPlayWAV ? '✓ 支持' : '✗ 不支持');
                    console.log('- OGG:', canPlayOGG ? '✓ 支持' : '✗ 不支持');
                }
                
                // 显示音频支持信息
                const supportInfo = `音频支持: MP3${canPlayMP3 ? '✓' : '✗'} WAV${canPlayWAV ? '✓' : '✗'} OGG${canPlayOGG ? '✓' : '✗'}`;
                console.log(supportInfo);
            }
            
            // 测试网络连接
            function testNetworkConnection() {
                if (DEBUG_MODE) console.log('测试网络连接...');
                
                fetch('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', {
                    method: 'HEAD',
                    mode: 'cors'
                })
                .then(response => {
                    if (DEBUG_MODE) console.log('网络连接测试: ✓ 成功');
                })
                .catch(error => {
                    if (DEBUG_MODE) console.log('网络连接测试: ✗ 失败', error);
                    showNotification('⚠️ 网络连接可能有问题');
                });
            }
            
            // 测试CORS支持
            function testCorsSupport() {
                if (DEBUG_MODE) console.log('测试CORS支持...');
                
                const testImage = new Image();
                testImage.crossOrigin = 'Anonymous';
                testImage.src = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
                
                testImage.onload = function() {
                    if (DEBUG_MODE) console.log('CORS测试: ✓ 允许跨域');
                };
                
                testImage.onerror = function() {
                    if (DEBUG_MODE) console.log('CORS测试: ⚠️ 可能有限制');
                };
            }
            
            // 初始化音频播放器
            function initAudioPlayer() {
                if (DEBUG_MODE) console.log('initAudioPlayer() 被调用');
                
                if (playlist.length > 0) {
                    if (DEBUG_MODE) console.log('加载第一首曲目:', playlist[0].title);
                    loadTrack(0);
                    
                    // 显示详细信息
                    setTimeout(() => {
                        showNotification(`已加载音频: ${playlist[0].title}`);
                        showNotification(`💡 提示: 尝试播放第一首测试音频`);
                    }, 1000);
                } else {
                    showNotification('播放列表为空，请添加音频文件');
                }
            }
            
            // 加载音频曲目 - 支持多种格式
            function loadTrack(index) {
                if (DEBUG_MODE) console.log('=== loadTrack() 被调用 ===');
                
                const track = playlist[index];
                if (DEBUG_MODE) console.log('加载曲目:', track.title, 'URL:', track.url);
                
                // 更新当前曲目显示
                currentTrackEl.textContent = `${track.title} - ${track.artist}`;
                
                // 显示加载中提示
                showNotification(`正在加载: ${track.title}...`);
                
                // 获取文件扩展名
                const fileExtension = track.url.split('.').pop().toLowerCase();
                console.log('File extension:', fileExtension);
                
                // 重置所有source标签
                document.getElementById('audio-mp3').src = '';
                document.getElementById('audio-wav').src = '';
                document.getElementById('audio-ogg').src = '';
                document.getElementById('audio-aac').src = '';
                
                // 根据文件扩展名设置对应的source
                switch(fileExtension) {
                    case 'mp3':
                        document.getElementById('audio-mp3').src = track.url;
                        break;
                    case 'wav':
                        document.getElementById('audio-wav').src = track.url;
                        break;
                    case 'ogg':
                        document.getElementById('audio-ogg').src = track.url;
                        break;
                    case 'aac':
                        document.getElementById('audio-aac').src = track.url;
                        break;
                    default:
                        // 如果扩展名不明确，尝试所有格式
                        document.getElementById('audio-mp3').src = track.url;
                        console.log('Unknown format, trying as MP3 first');
                }
                
                // 监听加载事件
                audioPlayer.addEventListener('loadedmetadata', function onMetadataLoaded() {
                    if (DEBUG_MODE) console.log('元数据加载完成 - 时长:', audioPlayer.duration);
                    
                    // 更新总时长显示
                    const totalSeconds = Math.floor(audioPlayer.duration);
                    const totalMinutes = Math.floor(totalSeconds / 60);
                    const totalSecs = totalSeconds % 60;
                    
                    totalTimeEl.textContent = 
                        (totalMinutes < 10 ? '0' : '') + totalMinutes + ':' + 
                        (totalSecs < 10 ? '0' : '') + totalSecs;
                    
                    showNotification(`已加载: ${track.title} (${totalTimeEl.textContent})`);
                }, { once: true });
                
                // 监听加载错误
                audioPlayer.addEventListener('error', function onLoadError() {
                    if (DEBUG_MODE) console.error('加载曲目失败:', audioPlayer.error);
                    showNotification('加载失败: ' + getAudioErrorMessage(audioPlayer.error));
                    
                    // 尝试其他格式（如果当前格式失败）
                    if (fileExtension !== 'mp3') {
                        setTimeout(() => {
                            showNotification('尝试以MP3格式加载...');
                            document.getElementById('audio-mp3').src = track.url;
                            document.getElementById('audio-wav').src = '';
                            document.getElementById('audio-ogg').src = '';
                            document.getElementById('audio-aac').src = '';
                            audioPlayer.load();
                        }, 2000);
                    }
                }, { once: true });
                
                // 监听音频播放结束事件（自动切下一首）
                audioPlayer.addEventListener('ended', function() {
                    if (isPlaying) {
                        btnNext.click(); // 自动播放下一首
                    }
                });
                
                // 开始加载
                audioPlayer.load();
                
                // 更新页面标题
                document.title = `足球之音 - ${track.title}`;
                
                // 重置进度条
                resetProgress();
            }
            
            // 对话数据
            const conversations = {
                match: [
                    {
                        speaker: 'user',
                        text: '最近有什么精彩的足球比赛吗？'
                    },
                    {
                        speaker: 'host',
                        text: '当然！最近的欧冠决赛真是精彩绝伦，皇马以1-0击败了多特蒙德，夺得了队史第15座欧冠冠军！'
                    },
                    {
                        speaker: 'user',
                        text: '哇！进球的是谁？'
                    },
                    {
                        speaker: 'host',
                        text: '是维尼修斯在第79分钟打入了制胜球！这个进球展现了他出色的个人能力。'
                    }
                ],
                player: [
                    {
                        speaker: 'user',
                        text: '能给我讲讲梅西的故事吗？'
                    },
                    {
                        speaker: 'host',
                        text: '莱昂内尔·梅西被誉为足球史上最伟大的球员之一。他出生于阿根廷，早年加入巴塞罗那青训，17岁首次代表一线队出场，从此开始了传奇生涯。'
                    },
                    {
                        speaker: 'user',
                        text: '他获得过哪些重要荣誉？'
                    },
                    {
                        speaker: 'host',
                        text: '梅西曾7次获得金球奖，4次欧冠冠军，10次西甲冠军，还有2022年世界杯冠军！他的职业生涯充满了纪录和荣誉。'
                    }
                ]
            };
            
            // 播放/暂停功能
            btnPlay.addEventListener('click', function() {
                isPlaying = !isPlaying;
                
                if (isPlaying) {
                    // 开始播放
                    btnPlay.innerHTML = '<i class="fa fa-pause"></i>';
                    vinylRecord.classList.add('rotate-record');
                    startProgress(); // 启动进度条
                    
                    // 播放音频
                    togglePlay();
                } else {
                    // 暂停播放
                    btnPlay.innerHTML = '<i class="fa fa-play"></i>';
                    vinylRecord.classList.remove('rotate-record');
                    stopProgress(); // 停止进度条
                    
                    // 暂停音频
                    togglePlay();
                }
            });
            
            // 上一首按钮
            btnPrev.addEventListener('click', function() {
                // 添加按钮点击效果
                addButtonEffect(btnPrev);
                
                if (playlist.length > 0) {
                    // 计算上一首索引
                    currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
                    
                    // 加载并播放上一首
                    loadTrack(currentTrackIndex);
                    
                    if (isPlaying) {
                        audioPlayer.play().catch(error => {
                            console.error('播放失败:', error);
                            showNotification('播放失败，请检查音频链接');
                        });
                    }
                    
                    // 显示提示
                    showNotification(`已切换到: ${playlist[currentTrackIndex].title}`);
                } else {
                    showNotification('播放列表为空');
                }
            });
            
            // 下一首按钮
            btnNext.addEventListener('click', function() {
                // 添加按钮点击效果
                addButtonEffect(btnNext);
                
                if (playlist.length > 0) {
                    // 计算下一首索引
                    currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
                    
                    // 加载并播放下一首
                    loadTrack(currentTrackIndex);
                    
                    if (isPlaying) {
                        audioPlayer.play().catch(error => {
                            console.error('播放失败:', error);
                            showNotification('播放失败，请检查音频链接');
                        });
                    }
                    
                    // 显示提示
                    showNotification(`已切换到: ${playlist[currentTrackIndex].title}`);
                } else {
                    showNotification('播放列表为空');
                }
            });
            
            // 对话按钮1 - 讨论比赛
            btnConvo1.addEventListener('click', function() {
                // 添加按钮点击效果
                addButtonEffect(btnConvo1);
                
                // 显示对话
                displayConversation('match');
            });
            
            // 对话按钮2 - 球员故事
            btnConvo2.addEventListener('click', function() {
                // 添加按钮点击效果
                addButtonEffect(btnConvo2);
                
                // 显示对话
                displayConversation('player');
            });
            
            // 进度条更新函数（基于真实音频时长）
            function startProgress() {
                // 清除之前的定时器
                stopProgress();
                
                // 设置新的定时器
                progressInterval = setInterval(function() {
                    if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
                        // 基于真实音频时长计算进度
                        currentProgress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                        progressBar.style.width = currentProgress + '%';
                        updateTimeDisplay();
                        
                        // 音频播放完毕
                        if (currentProgress >= 100) {
                            resetProgress();
                        }
                    }
                }, 500); // 降低更新频率，减少性能消耗
            }
            
            // 停止进度更新
            function stopProgress() {
                clearInterval(progressInterval);
            }
            
            // 重置进度
            function resetProgress() {
                currentProgress = 0;
                progressBar.style.width = '0%';
                currentTimeEl.textContent = '00:00';
                stopProgress();
            }
            
            // 更新时间显示（基于真实音频时长）
            function updateTimeDisplay() {
                if (!audioPlayer.duration || isNaN(audioPlayer.duration)) return;
                
                // 当前时间（秒）
                const currentSeconds = Math.floor(audioPlayer.currentTime);
                // 格式化时间
                const currentMinutes = Math.floor(currentSeconds / 60);
                const currentSecs = currentSeconds % 60;
                
                // 更新显示
                currentTimeEl.textContent = 
                    (currentMinutes < 10 ? '0' : '') + currentMinutes + ':' + 
                    (currentSecs < 10 ? '0' : '') + currentSecs;
            }
            
            // 显示对话
            function displayConversation(type) {
                // 清空对话区域
                chatContainer.innerHTML = '';
                
                // 获取对话数据
                const convo = conversations[type];
                
                // 逐个添加对话
                convo.forEach((message, index) => {
                    setTimeout(() => {
                        addMessage(message.speaker, message.text);
                        
                        // 滚动到底部
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }, index * 800);
                });
            }
            
            // 添加消息到对话区域
            function addMessage(speaker, text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'flex mb-4 ' + (speaker === 'user' ? 'justify-end' : '');
                
                if (speaker === 'user') {
                    // 用户消息
                    messageDiv.innerHTML = `
                        <div class="bg-blue-600 rounded-lg py-2 px-3 max-w-[80%]">
                            <p>${text}</p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center ml-2 flex-shrink-0">
                            <i class="fa fa-user"></i>
                        </div>
                    `;
                } else {
                    // 主持人消息
                    messageDiv.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center mr-2 flex-shrink-0">
                            <i class="fa fa-microphone"></i>
                        </div>
                        <div class="bg-green-600 rounded-lg py-2 px-3 max-w-[80%]">
                            <p>${text}</p>
                        </div>
                    `;
                }
                
                chatContainer.appendChild(messageDiv);
            }
            
            // 添加按钮点击效果
            function addButtonEffect(button) {
                // 创建波纹效果
                const ripple = document.createElement('span');
                ripple.className = 'absolute top-1/2 left-1/2 w-0 h-0 rounded-full bg-white bg-opacity-30 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-500';
                button.appendChild(ripple);
                
                // 设置波纹大小
                setTimeout(() => {
                    ripple.style.width = '100px';
                    ripple.style.height = '100px';
                }, 10);
                
                // 移除波纹
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }
            
            // 显示通知
            function showNotification(text) {
                // 创建通知元素
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-secondary text-primary px-4 py-2 rounded-lg shadow-lg z-50 transform translate-x-full transition-transform duration-300';
                notification.textContent = text;
                document.body.appendChild(notification);
                
                // 显示通知
                setTimeout(() => {
                    notification.classList.remove('translate-x-full');
                }, 10);
                
                // 隐藏通知
                setTimeout(() => {
                    notification.classList.add('translate-x-full');
                    
                    // 移除元素
                    setTimeout(() => {
                        notification.remove();
                    }, 300);
                }, 2000);
            }
            
            // 播放/暂停音频 - 增强版
            function togglePlay() {
                if (DEBUG_MODE) {
                    console.log('=== togglePlay() 被调用 ===');
                    console.log('isPlaying:', isPlaying);
                    console.log('Current audio src:', audioPlayer.src);
                    console.log('Audio readyState:', audioPlayer.readyState);
                    console.log('Audio networkState:', audioPlayer.networkState);
                    console.log('Audio error:', audioPlayer.error);
                }
                
                if (audioPlayer.src === '') {
                    // 如果没有音频源，尝试加载第一首
                    if (playlist.length > 0) {
                        console.log('Loading first track:', playlist[0].title);
                        loadTrack(0);
                    } else {
                        showNotification('播放列表为空，请添加音频文件');
                        isPlaying = false;
                        btnPlay.innerHTML = '<i class="fa fa-play"></i>';
                        return;
                    }
                }
                
                try {
                    if (isPlaying) {
                        if (DEBUG_MODE) console.log('暂停音频');
                        audioPlayer.pause();
                    } else {
                        if (DEBUG_MODE) console.log('尝试播放音频');
                        
                        // 检查音频是否已加载
                        if (audioPlayer.readyState < 1) {
                            console.log('Audio not loaded yet, trying to load');
                            audioPlayer.load();
                            
                            // 等待加载完成后播放
                            audioPlayer.addEventListener('canplay', function playWhenReady() {
                                if (DEBUG_MODE) console.log('音频可以播放了');
                                audioPlayer.play().catch(error => {
                                    console.error('播放失败:', error);
                                    showNotification('播放失败: ' + error.message);
                                    isPlaying = false;
                                    btnPlay.innerHTML = '<i class="fa fa-play"></i>';
                                });
                                // 移除事件监听器，避免重复触发
                                audioPlayer.removeEventListener('canplay', playWhenReady);
                            }, { once: true });
                            
                            // 监听加载错误
                            audioPlayer.addEventListener('error', function onError() {
                                if (DEBUG_MODE) console.error('音频加载错误:', audioPlayer.error);
                                showNotification('音频加载失败: ' + getAudioErrorMessage(audioPlayer.error));
                                isPlaying = false;
                                btnPlay.innerHTML = '<i class="fa fa-play"></i>';
                            }, { once: true });
                        } else {
                            // 音频已加载，直接播放
                            audioPlayer.play().catch(error => {
                                console.error('播放失败:', error);
                                showNotification('播放失败: ' + error.message);
                                isPlaying = false;
                                btnPlay.innerHTML = '<i class="fa fa-play"></i>';
                            });
                        }
                    }
                } catch (error) {
                    console.error('音频操作错误:', error);
                    showNotification('音频操作失败: ' + error.message);
                }
            }
            
            // 获取音频错误信息
            function getAudioErrorMessage(error) {
                if (!error) return '未知错误';
                
                const errorMessages = {
                    1: '用户中止了获取过程',
                    2: '网络错误',
                    3: '解码错误',
                    4: '音频格式不支持',
                    5: '音频无法使用'
                };
                
                return errorMessages[error.code] || '未知错误 (' + error.code + ')';
            }
            
            // 初始化
            preloadTest();
            initAudioPlayer();
        });
    </script>
</body>
</html>
